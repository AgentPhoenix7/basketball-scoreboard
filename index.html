<html>
    <head>
        <meta charset="UTF-8">
        <title>Basketball Scoreboard</title>
        <link rel="stylesheet" href="index.css">
    </head>
    <body class="theme-dark">
        <!-- Top bar for theme selector -->
        <div class="top-bar">
            <label for="theme">Theme: </label>
            <select id="theme" onchange="changeTheme(this.value)">
                <option value="dark">Dark</option>
                <option value="green">Green</option>
                <option value="blue">Blue</option>
                <option value="purple">Purple</option>
                <option value="red">Red</option>
                <option value="orange">Orange</option>
            </select>
        </div>

        <!-- Scoreboard wrapper -->
        <div class="scoreboard-wrapper">
            <div class="container">
                <!-- Home Team -->
                <div class="team" id="home-team">
                    <h3>HOME</h3>
                    <div id="home-score" class="score">0</div>
                    <div class="buttons">
                        <button onclick="addScore('home', 1)">+1</button>
                        <button onclick="addScore('home', 2)">+2</button>
                        <button onclick="addScore('home', 3)">+3</button>
                    </div>
                </div>

                <!-- Guest Team -->
                <div class="team" id="guest-team">
                    <h3>GUEST</h3>
                    <div id="guest-score" class="score">0</div>
                    <div class="buttons">
                        <button onclick="addScore('guest', 1)">+1</button>
                        <button onclick="addScore('guest', 2)">+2</button>
                        <button onclick="addScore('guest', 3)">+3</button>
                    </div>
                </div>
            </div>

            <!-- New Game Button -->
            <button class="new-game" onclick="newGame()">🏀 New Game</button>
        </div>

        <script src="index.js"></script>
    </body>
</html>
